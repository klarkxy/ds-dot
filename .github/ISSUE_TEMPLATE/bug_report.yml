name: Bug report
description: Something in ds-dot does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Dorothy's panel
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ds-dot version
      placeholder: 0.2.1
    validations:
      required: true
  - type: input
    id: dsh
    attributes:
      label: DeepSeek Harness version and OS
      placeholder: dsh 0.2.2-rc.3 on Windows 11
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
