name: Feature or change
description: Propose a feature, improvement or refactor before working on it.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and for whom.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: How we can tell it works.
  - type: checkboxes
    id: owner
    attributes:
      label: Ownership
      options:
        - label: I plan to open the pull request myself
