name: Close linked issues

# main is the default branch, so GitHub only auto-closes "Closes #123" issues
# on release. Close them as soon as the pull request lands on dev instead.
on:
  pull_request_target:
    branches: [dev]
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    name: Close linked issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # No checkout: only the PR description is read, through an env variable.
      - name: Close issues referenced with a closing keyword
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          numbers=$(printf '%s' "$BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]*:?[[:space:]]+#[0-9]+' \
            | grep -oE '[0-9]+$' | sort -un || true)
          if [ -z "$numbers" ]; then
            echo "No linked issues."
            exit 0
          fi
          for n in $numbers; do
            state=$(gh issue view "$n" --json state --jq .state 2>/dev/null || echo missing)
            if [ "$state" = OPEN ]; then
              gh issue close "$n" --reason completed --comment "Fixed on \`dev\` by #$PR; ships in the next release."
              echo "Closed #$n"
            else
              echo "Skipped #$n ($state)"
            fi
          done
