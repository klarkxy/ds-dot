name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check package and release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          if (pkg.name !== 'ds-dot') throw new Error('Expected package name ds-dot')
          const tag = process.env.RELEASE_TAG
          if (tag) {
            if (tag.replace(/^v/, '') !== pkg.version) {
              throw new Error(`Release ${tag} does not match package version ${pkg.version}`)
            }
            if ((process.env.RELEASE_PRERELEASE === 'true') !== pkg.version.includes('-')) {
              throw new Error('Release prerelease status must match the package version')
            }
          }
          NODE
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts
      - name: Publish
        if: github.event_name == 'release'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish --access public --ignore-scripts --tag "$NPM_TAG"
